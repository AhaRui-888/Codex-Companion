<!doctype html><html><head><meta charset="utf-8"><title>Isolated recharge fixture</title>
<style>
body{margin:0;font-family:sans-serif}.sidebar{height:100vh;width:248px;position:fixed}.workspace{margin-left:248px}.topbar{height:74px}.page-wrap{padding:28px 30px 50px}.wallet-hero{height:160px}.panel{margin-top:14px;border:1px solid #ddd}.panel-head{display:flex;justify-content:space-between;padding:16px}.amount-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:20px}.payment-methods{display:flex;padding:20px}.payment-methods button{padding:15px}.payment-checkout-body{padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}.payment-checkout-body>svg{max-width:100%;height:auto;background:white}.payment-order-list{min-height:400px}.tag{font-size:12px;background:#edf2ef;padding:4px 7px;border-radius:12px}.form-error{background:#fff0f0;color:#a32630}.pay-icon{display:grid;place-items:center}.wechat{color:#167d49}.alipay{color:#287bc9}
.primary-button:hover:not(:disabled){background:#f0fff6;color:#fff;box-shadow:0 6px 28px #b7d5ca25}
</style></head><body><div id="root"><div class="app-shell"><aside class="sidebar">导航</aside><main class="workspace"><header class="topbar">控制台</header><div class="page-wrap">
<section class="wallet-hero">账户余额</section>
<section class="recharge-panel panel"><div class="panel-head"><div><h3>充值余额</h3><p>选择金额后使用手机扫码支付</p></div><span class="secure-pay">服务端验签后入账</span></div>
<div class="amount-grid"><button>¥10</button><button>¥20</button><button>¥50</button><button class="selected">¥100</button><button>¥200</button><button>¥500</button></div>
<div class="payment-methods"><button class="selected"><div class="pay-icon wechat"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M1 1h5v5H1zM12 1h5v5h-5zM1 12h5v5H1zM10 10h7v7h-7z" fill="none" stroke="currentColor"/></svg></div><span><strong>微信支付</strong><small>Native 二维码</small></span></button><button><div class="pay-icon alipay"></div><span><strong>支付宝</strong><small>尚未开通</small></span></button></div>
<button class="primary-button recharge-button">生成 ¥100.00 支付订单</button></section>
<section class="panel payment-order-list"><h3>充值订单</h3><p>历史订单</p></section>
</div></main></div></div>
<script>
// Representative markup from the public website; synthetic controls never issue an order request.
const amounts = [...document.querySelectorAll('.amount-grid button')];
amounts.forEach(button => button.onclick = () => { amounts.forEach(item => item.classList.toggle('selected', item === button)); document.querySelector('.recharge-button').textContent = '生成 ' + button.textContent + '.00 支付订单'; });
const methods = [...document.querySelectorAll('.payment-methods button')];
methods.forEach((button, index) => button.onclick = () => { methods.forEach(item => item.classList.toggle('selected', item === button)); document.querySelector('.recharge-button').disabled = index === 1; });
document.querySelector('.recharge-button').onclick = () => {
 document.querySelectorAll('.recharge-panel button').forEach(button => button.disabled = true);
 const checkout = document.createElement('section'); checkout.className = 'panel payment-checkout';
 checkout.innerHTML = '<div class="panel-head"><div><h3>微信支付充值</h3><p>订单 fixture-only</p></div><span class="tag">待支付</span></div><div class="payment-checkout-body"><strong class="payment-checkout-amount">¥50.00</strong><svg viewBox="0 0 29 29" width="224" height="224" role="img" aria-label="测试二维码" xmlns="http://www.w3.org/2000/svg"><rect width="29" height="29" fill="white"/><path d="M2 2h7v7H2zM20 2h7v7h-7zM2 20h7v7H2z" fill="none" stroke="black"/><path d="M4 4h3v3H4zM22 4h3v3h-3zM4 22h3v3H4zM12 3h3v5h-3zM12 12h4v4h-4zM19 12h3v3h-3zM23 17h3v6h-3zM12 20h4v5h-4zM18 24h3v3h-3z"/></svg><p>请使用微信支付扫一扫</p><p class="payment-countdown">剩余 14:59</p><p class="payment-help">页面会自动确认支付结果。请勿重复付款，余额以服务端确认为准。</p><div class="key-actions"><button>我已支付，查询结果</button><button class="danger">关闭订单</button></div></div>';
 document.querySelector('.page-wrap').appendChild(checkout);
};
</script></body></html>
